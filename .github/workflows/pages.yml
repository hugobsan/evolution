name: Deploy v2 + v1 (GitHub Pages)
# v2 multiplayer (branch v2) na raiz; v1 offline (branch main) em /v1/; /v2/ redireciona para a raiz (links antigos).
# Mudou só a branch v2? Rode este workflow manualmente (Actions → Run workflow): ele sempre builda as duas branches.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
      - uses: actions/checkout@v4
        with:
          ref: main
          path: v1src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v1src/package-lock.json
      - name: Build v2 (raiz)
        run: npm ci && npm run build
      - name: Build v1 em /v1/ e redirecionamento /v2/ → /
        run: |
          cd v1src && npm ci && npm run build && cd ..
          rm -f v1src/dist/CNAME
          mkdir -p dist/v1 && cp -r v1src/dist/. dist/v1/
          mkdir -p dist/v2
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Evolution</title>' \
            '<meta http-equiv="refresh" content="0; url=../"><script>location.replace("../")</script>' > dist/v2/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
