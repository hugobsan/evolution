name: Supabase keep-alive
# Projetos Supabase no plano Free pausam após 7 dias sem uso; este ping chama a RPC pública ping() a cada 3 dias.
# A URL e a chave publishable são públicas por design (vão no cliente da v2); o acesso real é controlado por RLS.
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "https://xezwvhrbculmnyksjyen.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_r04Ktxhs4LJZJj663lDx4A_9xzmG-Rl" \
            -H "Content-Type: application/json" -d '{}'
